name: Security Scan

on:
  push:
  pull_request:
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read

jobs:
  backend-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache-dependency-path: backend/go.sum
      - name: Verify Go version
        run: |
          go version | grep -q 'go1.27.2'
      - name: Run govulncheck
        working-directory: backend
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  frontend-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Test audit report validation
        run: python3 -m unittest discover -s tools -p 'test_check_pnpm_audit_exceptions.py'
      - name: Run pnpm audit
        working-directory: frontend
        run: |
          audit_status=0
          pnpm audit --prod --audit-level=high --json > audit.json 2> audit.stderr || audit_status=$?
          echo "$audit_status" > audit.exit
      - name: Check audit exceptions
        run: |
          python tools/check_pnpm_audit_exceptions.py \
            --audit frontend/audit.json \
            --exceptions .github/audit-exceptions.yml \
            --audit-exit-code "$(cat frontend/audit.exit)"
      - name: Upload pnpm audit evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pnpm-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            frontend/audit.json
            frontend/audit.stderr
            frontend/audit.exit
          if-no-files-found: error
          retention-days: 14
