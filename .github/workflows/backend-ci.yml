name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  upstream-sync-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Upstream sync tool tests
        run: python -m unittest discover -s tools/tests -p 'test_*.py' -v
      - name: Upstream provenance and compatibility audit
        run: python tools/upstream-sync/sync.py audit
      - name: Original scheduler diff allowlist
        run: python tools/upstream-sync/sync.py scheduler-diff
      - name: Documentation consistency
        run: python tools/check_docs_consistency.py

  shell:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - name: Check deployment scripts
        run: |
          /bin/bash -n deploy/apple-container.sh
          /bin/bash deploy/tests/apple-container-test.sh
          /bin/sh deploy/tests/docker-compose-security-test.sh
          /bin/sh deploy/tests/docker-compose-gateway-env-test.sh
          /bin/sh deploy/tests/docker-runtime-resources-test.sh
          /bin/sh deploy/test-caddyfile-cache.sh

  test:
    runs-on: ubuntu-latest
    services:
      scheduling-postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: scheduling_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: scheduling_ci_fixture
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d scheduling_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      scheduling-redis:
        image: redis:8.4-alpine
        ports:
          - 16379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v6
      - name: Check Docker Compose simple mode environment
        run: /bin/sh deploy/tests/docker-compose-simple-mode-env-test.sh
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Verify Go version
        run: |
          go version | grep -q 'go1.27.2'
      - name: Unit tests
        working-directory: backend
        run: make test-unit
      - name: Integration tests
        working-directory: backend
        run: make test-integration
      - name: Gateway reliability
        working-directory: backend
        timeout-minutes: 20
        run: |
          set -euo pipefail
          go test -race -p 1 -parallel 1 -tags=unit \
            ./internal/service ./internal/handler ./internal/handler/admin \
            -run '^(TestGPT61Sol(NativeHTTP|HTTPValidation|WS)|TestNonstreamReadErrorSafety$|TestRequestBodyReplaySafety$|TestOpenAIQualityRoutingInertWithoutOptIn$|TestGatewayBufferedReadFailureAuthenticatedFailover$|TestRetiredSchedulingRoutesAnswerGone$|TestShareScheduling|TestOpenAIShareScheduling|TestShareAttribution)' \
            -count=1 -timeout=10m -json | tee "$RUNNER_TEMP/gateway-reliability.jsonl"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          required = {
              "service": {
                  "TestGPT61SolNativeHTTPValidationBeforeNormalization",
                  "TestGPT61SolHTTPValidationUsesActualCompactAndPassthroughModel",
                  "TestGPT61SolWSFirstFrameValidationUsesMappedModel",
                  "TestGPT61SolWSLaterTurnValidationAndSessionModel",
                  "TestGPT61SolWSMappedOutKeepsTargetReasoningRules",
                  "TestNonstreamReadErrorSafety",
                  "TestRequestBodyReplaySafety",
                  "TestOpenAIQualityRoutingInertWithoutOptIn",
                  "TestShareSchedulingDisabledKeepsOriginalScheduler",
                  "TestShareSchedulingFallbackWaitDefersBinding",
                  "TestShareSchedulingSoftSpillKeepsBindingThroughShortOutage",
                  "TestShareSchedulingWaitsBoundedlyForWarmBoundAccount",
                  "TestOpenAIShareSchedulingAdmissionBindKeepsPlannedBinding",
                  "TestOpenAIShareSchedulingHonoursResponseOwner",
                  "TestShareAttributionFollowsServedPlacements",
              },
              "handler": {
                  "TestGatewayBufferedReadFailureAuthenticatedFailover",
              },
              "handler/admin": {
                  "TestRetiredSchedulingRoutesAnswerGone",
              },
          }
          events = [json.loads(line) for line in
                    Path(os.environ["RUNNER_TEMP"], "gateway-reliability.jsonl").read_text().splitlines()
                    if line.strip()]
          rejected = [event for event in events if event.get("Action") in {"skip", "fail"}]
          if rejected:
              raise SystemExit("Gateway reliability gate cannot skip or fail: " +
                               json.dumps(rejected, ensure_ascii=False))
          for name, expected in required.items():
              package = "github.com/liulixin-lex/xy2api/internal/" + name
              ran = {event.get("Test") for event in events
                     if event.get("Package") == package and event.get("Action") == "run"}
              passed = {event.get("Test") for event in events
                        if event.get("Package") == package and event.get("Action") == "pass"}
              missing = expected - (ran & passed)
              if missing or None not in passed:
                  raise SystemExit(f"{package}: missing completed required tests {sorted(missing)}")
              print(f"{package}: {len(ran)} tests/subtests ran, all {len(expected)} required tests PASS, 0 SKIP")
          PY


      - name: Gateway resilience
        working-directory: backend
        timeout-minutes: 20
        # Every test of the resilience test files, -race, no skips (tasks 13.1).
        run: python3 ../tools/gateway-resilience/ci_gate.py

      - name: OpenAI cache reliability with real Redis
        working-directory: backend
        timeout-minutes: 15
        env:
          SCHEDULING_TEST_REDIS_ADDR: 127.0.0.1:16379
        run: |
          set -euo pipefail
          go test -race -p 1 -tags=unit \
            ./internal/pkg/apicompat ./internal/service ./internal/service/openai_ws_v2 ./internal/repository ./internal/handler \
            -run '^(TestOpenAICache|TestCacheControls|TestOpenAIUsageCanonical|TestOpenAIUsageConversion|TestOpenAISelectAccountWithLoadAwareness_StickyCapacity)' \
            -count=1 -timeout=10m -json | tee "$RUNNER_TEMP/openai-cache-reliability.jsonl"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          events = [json.loads(line) for line in
                    Path(os.environ["RUNNER_TEMP"], "openai-cache-reliability.jsonl").read_text().splitlines()
                    if line.strip()]
          rejected = [e for e in events if e.get("Action") in {"skip", "fail"}]
          if rejected:
              raise SystemExit("Cache gate cannot skip or fail: " + json.dumps(rejected))
          expected = {
              "TestOpenAIUsageCanonicalPrecedence",
              "TestOpenAIUsageConversionExplicitZeroAndWritePrecedence",
              "TestCacheControlsAndDiagnosticsSurviveConversion",
              "TestOpenAICacheIdentityTenantScope",
              "TestOpenAICacheStableLeadingPrefix",
              "TestOpenAICacheCapabilityIgnoresUserAgent",
              "TestOpenAICacheDiagnosticPrivacyAndTraining",
              "TestOpenAICacheDiagnosticUsesFinalRequest",
              "TestOpenAICachePreferencePreservesPriorityLoadAndUnknowns",
              "TestOpenAICachePreferenceRequiresRecentSamples",
              "TestOpenAICacheConcurrentColdSelection",
              "TestOpenAICacheSpilloverAdmissionPreservesAffinity",
              "TestOpenAICacheWSUsageAliasesAndExplicitZero",
              "TestOpenAICacheStickyAtomic",
              "TestOpenAICacheUnadmittedReservationExpires",
              "TestOpenAISelectAccountWithLoadAwareness_StickyCapacitySpilloverKeepsBinding",
          }
          ran = {e.get("Test") for e in events if e.get("Action") == "run"}
          passed = {e.get("Test") for e in events if e.get("Action") == "pass"}
          if expected - (ran & passed):
              raise SystemExit("Missing cache tests: " + repr(expected - (ran & passed)))
          print(f"All {len(expected)} required cache tests PASS, 0 SKIP")
          PY

      - name: Hosted recharge integration with real PostgreSQL
        working-directory: backend
        timeout-minutes: 15
        env:
          STRIPE_HOSTED_TEST_DSN: postgres://postgres:scheduling_ci_fixture@127.0.0.1:15432/scheduling_ci?sslmode=disable
        run: |
          set -euo pipefail
          go test -race -p 1 -parallel 1 -tags=unit ./internal/service \
            -run '^TestStripeHostedDatabase' \
            -count=1 -timeout=5m -json > "$RUNNER_TEMP/upstream-cross-paths.jsonl"
          python3 - <<'PYCODE'
          import json
          import os
          from pathlib import Path

          events = [json.loads(line) for line in
                    Path(os.environ["RUNNER_TEMP"], "upstream-cross-paths.jsonl").read_text().splitlines()
                    if line.strip()]
          rejected = [event for event in events if event.get("Action") in {"skip", "fail"}]
          if rejected:
              raise SystemExit("Cross-path gate cannot skip or fail: " + json.dumps(rejected))
          passed = {event.get("Test") for event in events if event.get("Action") == "pass"}
          expected = {
              "TestStripeHostedDatabaseCreateRecoveryAndConcurrentLimits/no_promotion",
              "TestStripeHostedDatabaseCreateRecoveryAndConcurrentLimits/bonus",
              "TestStripeHostedDatabaseCreateRecoveryAndConcurrentLimits/discount",
              "TestStripeHostedDatabaseSerializesNewRequests",
          }
          if expected - passed:
              raise SystemExit("Missing required cross-path tests: " + repr(expected - passed))
          print(f"All {len(expected)} required cross-path tests PASS, 0 SKIP")
          PYCODE

  windows-plugin-archive:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Verify Windows plugin archive handoff
        working-directory: backend
        run: go test ./internal/service -run '^TestPluginPackageInstallerInstallUnsignedDevelopmentPackage$' -count=1

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Frontend typecheck and critical vitest
        run: make test-frontend

  golangci-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Verify Go version
        run: |
          go version | grep -q 'go1.27.2'
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          args: --timeout=30m
          working-directory: backend

  release-helpers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r .github/release-tools/requirements-release.txt
      - run: python -m unittest discover -s .github/release-tools -p 'test_release_matrix.py'
      - run: bash -n .github/release-tools/release-images.sh
