      - name: Native stream forwarding latency without race instrumentation
        working-directory: backend
        timeout-minutes: 5
        env:
          GOMAXPROCS: '2'
          XY2_NATIVE_RELAY_PERF: '1'
        run: |
          set -euo pipefail
          go test -p 1 -vet=off ./internal/service \
            -run '^TestNativeStreamRelayReadToFlushPerformance$' \
            -count=1 -timeout=90s -json | tee "$RUNNER_TEMP/native-stream-performance.jsonl"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          package = "github.com/liulixin-lex/xy2api/internal/service"
          root = "TestNativeStreamRelayReadToFlushPerformance"
          required = {root} | {f"{root}/passthrough_{mode}_concurrency_{count}"
                               for mode in ["false", "true"] for count in [1, 16, 64]}
          events = [json.loads(line) for line in
                    Path(os.environ["RUNNER_TEMP"], "native-stream-performance.jsonl").read_text().splitlines()
                    if line.strip()]
          rejected = [event for event in events if event.get("Action") in {"skip", "fail"}]
          if rejected:
              raise SystemExit("Native stream performance gate cannot skip or fail: " +
                               json.dumps(rejected, ensure_ascii=False))
          ran = {event.get("Test") for event in events
                 if event.get("Package") == package and event.get("Action") == "run"}
          passed = {event.get("Test") for event in events
                    if event.get("Package") == package and event.get("Action") == "pass"}
          missing = required - (ran & passed)
          if missing or None not in passed:
              raise SystemExit(f"Native stream performance gate missing completed cases: {sorted(missing)}")
          print("HTTP ordinary/passthrough at concurrency 1, 16, 64: all 6 cases PASS, 0 SKIP, no race instrumentation")
          PY

  windows-plugin-archive:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Verify Windows plugin archive handoff
        working-directory: backend
        run: go test ./internal/service -run '^TestPluginPackageInstallerInstallUnsignedDevelopmentPackage$' -count=1

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Frontend typecheck and critical vitest
        run: make test-frontend

  golangci-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Verify Go version
        run: |
          go version | grep -q 'go1.27.0'
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13
          args: --timeout=30m
          working-directory: backend

  release-helpers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r .github/release-tools/requirements-release.txt
      - run: python -m unittest discover -s .github/release-tools -p 'test_release_matrix.py'
      - run: bash -n .github/release-tools/release-images.sh
