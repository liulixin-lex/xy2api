name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  upstream-sync-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Upstream sync tool tests
        run: python -m unittest discover -s tools/tests -p 'test_*.py' -v
      - name: Upstream provenance and compatibility audit
        run: python tools/upstream-sync/sync.py audit

  shell:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - name: Check deployment scripts
        run: |
          /bin/bash -n deploy/apple-container.sh
          /bin/bash deploy/tests/apple-container-test.sh
          /bin/sh deploy/tests/docker-compose-security-test.sh
          /bin/sh deploy/tests/docker-compose-gateway-env-test.sh
          /bin/sh deploy/tests/docker-runtime-resources-test.sh
          /bin/sh deploy/test-caddyfile-cache.sh

  test:
    runs-on: ubuntu-latest
    services:
      scheduling-postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: scheduling_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: scheduling_ci_fixture
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d scheduling_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      scheduling-redis:
        image: redis:8.4-alpine
        ports:
          - 16379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v6
      - name: Check Docker Compose simple mode environment
        run: /bin/sh deploy/tests/docker-compose-simple-mode-env-test.sh
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Verify Go version
        run: |
          go version | grep -q 'go1.27.0'
      - name: Unit tests
        working-directory: backend
        run: make test-unit
      - name: Integration tests
        working-directory: backend
        run: make test-integration
      - name: Scheduling reliability with real PostgreSQL and Redis
        working-directory: backend
        timeout-minutes: 20
        env:
          SCHEDULING_TEST_POSTGRES_DSN: postgres://postgres:scheduling_ci_fixture@127.0.0.1:15432/scheduling_ci?sslmode=disable
          SCHEDULING_TEST_REDIS_ADDR: 127.0.0.1:16379
        run: |
          set -euo pipefail
          go test -race -p 1 -parallel 1 -tags=unit \
            ./internal/service ./internal/handler ./internal/scheduling \
            -run '^(TestAccountPool|TestGPT61Sol(NativeHTTP|HTTPValidation|WS)|TestReviewPR74|TestReviewV021|TestNonstreamReadErrorSafety$|TestControlledProtocolFailureEvidence$|TestControlledTerminalUsageCertainty$|TestGatewayBufferedReadFailureAuthenticatedFailover$)' \
            -count=1 -timeout=10m -json | tee "$RUNNER_TEMP/scheduling-reliability.jsonl"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          required = {
              "service": {
                  "TestGPT61SolNativeHTTPValidationBeforeNormalization",
                  "TestGPT61SolHTTPValidationUsesActualCompactAndPassthroughModel",
                  "TestGPT61SolWSFirstFrameValidationUsesMappedModel",
                  "TestGPT61SolWSLaterTurnValidationAndSessionModel",
                  "TestGPT61SolWSMappedOutKeepsTargetReasoningRules",
                  "TestAccountPoolGPT61SolSharedWeightsAliasesAndGroups",
                  "TestAccountPoolGPT61SolExhaustsSameTier",
                  "TestAccountPoolGPT61SolCancellationBoundary",
                  "TestAccountPoolGPT61SolInvalidEffortDoesNotMutateAdmission",
                  "TestAccountPoolEntryExplicitGroupExcludesOutsideSimplePool",
                  "TestAccountPoolEntrySharedModelWeightsAndIndependentGroups",
                  "TestAccountPoolEntrySimpleDefaultScopeStillIncludesAllAccounts",
                  "TestAccountPoolEntryOwnerCannotEscapeExplicitGroup",
                  "TestReviewPR74ProtocolEnvelopeCooldown",
                  "TestReviewPR74BufferedAttemptTimeoutAllowsFailover",
                  "TestReviewPR74AttemptTimeoutCancellationBoundary",
                  "TestReviewV021OpenAITransportNoRecursiveDispatch",
                  "TestReviewV021BufferedReadFailureAllowsFailover",
                  "TestReviewV021ProviderCooldownSurvivesRedisHealthLoss",
                  "TestReviewV021ProvenNotSentHasNoPendingUsage",
                  "TestNonstreamReadErrorSafety",
                  "TestControlledProtocolFailureEvidence",
                  "TestControlledTerminalUsageCertainty",
              },
              "handler": {
                  "TestGatewayBufferedReadFailureAuthenticatedFailover",
              },
              "scheduling": {
                  "TestAccountPoolAdmissionThenPriorityThenWeight",
                  "TestAccountPoolExhaustsEveryEligibleAccountBeforeLowerTier",
                  "TestAccountPoolSWRRRatioAndTwoClientFairness",
                  "TestAccountPoolFailureClassifierKeepsAuthoritativeScopeAndReplayStops",
                  "TestAccountPoolDoesNotConsultOrMutateLegacyRetryCredit",
              },
          }
          events = [json.loads(line) for line in
                    Path(os.environ["RUNNER_TEMP"], "scheduling-reliability.jsonl").read_text().splitlines()
                    if line.strip()]
          rejected = [event for event in events if event.get("Action") in {"skip", "fail"}]
          if rejected:
              raise SystemExit("Scheduling reliability gate cannot skip or fail: " +
                               json.dumps(rejected, ensure_ascii=False))
          for name, expected in required.items():
              package = "github.com/liulixin-lex/xy2api/internal/" + name
              ran = {event.get("Test") for event in events
                     if event.get("Package") == package and event.get("Action") == "run"}
              passed = {event.get("Test") for event in events
                        if event.get("Package") == package and event.get("Action") == "pass"}
              missing = expected - (ran & passed)
              if missing or None not in passed:
                  raise SystemExit(f"{package}: missing completed required tests {sorted(missing)}")
              print(f"{package}: {len(ran)} tests/subtests ran, all {len(expected)} required tests PASS, 0 SKIP")
          PY

      - name: Native stream and response recovery release gate
        working-directory: backend
        timeout-minutes: 20
        env:
          GOMAXPROCS: '2'
          SCHEDULING_TEST_POSTGRES_DSN: postgres://postgres:scheduling_ci_fixture@127.0.0.1:15432/scheduling_ci?sslmode=disable
          SCHEDULING_TEST_REDIS_ADDR: 127.0.0.1:16379
          XY2_RELAY_ACCEPTANCE_TIMING: '1'
        run: |
          set -euo pipefail
          go test -race -p 1 -parallel 1 -tags=unit \
            ./internal/service ./internal/handler ./internal/handler/admin ./internal/scheduling ./internal/server/routes ./internal/server/middleware \
            -run '^(TestReviewNative|TestAccountPoolCancelsAttemptBeforeNextTransport$|TestAccountPoolEntryExplicitGroupExcludesOutsideSimplePool$|TestAccountPoolEntryOwnerCannotEscapeExplicitGroup$|TestAccountPoolEntrySharedModelWeightsAndIndependentGroups$|TestAccountPoolEntrySimpleDefaultScopeStillIncludesAllAccounts$|TestAccountPoolGPT61SolCancellationBoundary$|TestAccountPoolGPT61SolExhaustsSameTier$|TestAccountPoolGPT61SolInvalidEffortDoesNotMutateAdmission$|TestAccountPoolGPT61SolSharedWeightsAliasesAndGroups$|TestAccountPoolOwnerUnsentAdmissionReleasesRecoveryProbe$|TestAccountPoolRealDispatchExhaustsEligibleTier$|TestControlledBufferedAnthropicTerminalValidation$|TestControlledBufferedBridgesRealSSE$|TestControlledBufferedFailureParityRealSSE$|TestControlledBufferedGeminiCollectorsRealSSE$|TestControlledBufferedNativeFailureParityRealSSE$|TestControlledBufferedResponseFailuresRealSSE$|TestControlledBufferedSSEEOFWaitsForAdapter$|TestControlledBufferedSSEForwardAdapters$|TestControlledCallerDeadlineDoesNotWaitForTerminalStoreLock$|TestControlledCandidateAdmissionBatchMatchesExistingDomains$|TestControlledCandidateAdmissionFiltersBeforeSharedReads$|TestControlledCrossProcessDomainProbeSurvivesRedisLoss$|TestControlledFailureModelFallbackUsesMappingAndDeadline$|TestControlledFallbackUsesRemainingAttemptBudget$|TestControlledFinalModelRevalidatesHealthAndProbeCapacity$|TestControlledGroupPolicyOwnerGuard$|TestControlledHTTPAuthenticationTerminalNeverRecoversHealth$|TestControlledImagesNonstreamNativeErrorAttribution$|TestControlledLeaseReviewCancelsHTTPDuringBlockedStorePoll$|TestControlledPreparationDeadlineBoundsStoreWaits$|TestControlledPreparationDeadlineDoesNotCancelCompletedLongStream$|TestControlledPrepareFailuresNeverCountActualDispatch$|TestControlledProtocolErrorBodyDeadline$|TestControlledProtocolLongStreamSurvivesD$|TestControlledProtocolNonstreamAcceptance$|TestControlledRealStoresAndHTTP$|TestControlledTerminalUsageCertainty$|TestExplainRealPostgresRedisIsPureAndPredictsNextSelection$|TestNativeStreamControlledDeliveryRealStores$|TestOneClickAccountSwitchLetsActiveSSEComplete$|TestOneClickAccountSwitchLetsActiveWSTurnFinishAndRejectsNextTurn$|TestReviewPR74BufferedAttemptTimeoutAllowsFailover$|TestReviewPR74ProtocolEnvelopeCooldown$|TestReviewV021BufferedReadFailureAllowsFailover$|TestReviewV021ProvenNotSentHasNoPendingUsage$|TestReviewV021ProviderCooldownSurvivesRedisHealthLoss$|TestSchedulingModeAuxiliaryUsesGroupRulesWithoutGenerationReservations$|TestSchedulingModeSub2APIBypassesControlledDispatchStore$|TestNativeStream|TestNativeResponse|TestControlledPassthrough|TestControlledOwnerConstraintSurvivesLegacyRollback$|TestAccountPool|TestPriorityWeightsModesAndCapacity$|TestStrictPriorityAllowsSameTierRecoveryProbeOnly$|TestHealthCooldownAndRecovery$|TestGroupPolicyPostgresMembershipAndCAS$|TestGatewayRoutes(NativeResponsesAliasesKeepWebSocketAndCatchAll|OpenAIResponsesCompactPathIsRegistered|ResponsesSubpathRejectsNonConformingSubpaths)$)' \
            -skip '^TestNativeStreamRelayReadToFlushPerformance$' \
            -count=1 -timeout=10m -json | tee "$RUNNER_TEMP/native-stream-functional.jsonl"
          go test -race -p 1 -parallel 1 ./internal/pkg/responseturn \
            -count=1 -timeout=3m -json | tee "$RUNNER_TEMP/native-stream-turns.jsonl"
          go test -race -p 1 -parallel 1 -tags=integration \
            ./internal/handler -run '^TestReviewNative(BackgroundRealBilling|StreamRealBilling)' \
            -count=1 -timeout=3m -json | tee "$RUNNER_TEMP/native-stream-billing.jsonl"
          go test -race -p 1 -parallel 1 -tags=unit \
            ./cmd/server -run '^TestProvideCleanup_WithMinimalDependencies_NoPanic$' \
            -count=1 -timeout=60s -json | tee "$RUNNER_TEMP/native-stream-cleanup.jsonl"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          required = {'cmd/server': {'TestProvideCleanup_WithMinimalDependencies_NoPanic'},
           'handler': {'TestNativeResponseControlPostOnlyHandlesExactCancel',
                       'TestNativeResponseHTTPAfterCommitFailureNeverMixesAccounts',
