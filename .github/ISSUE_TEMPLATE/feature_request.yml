name: 功能建议 / Feature request
description: 提出新功能或改进 / Suggest a feature or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题 / Problem
      description: 你遇到了什么限制，现在是怎么绕过的
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议的方案 / Proposal
      description: 你希望 XY2API 怎么做；涉及界面时可以附截图或草图
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案 / Alternatives considered
  - type: checkboxes
    id: checks
    attributes:
      label: 确认 / Checklist
      options:
        - label: 我已搜索过已有的 Issue 和 Discussion / I searched existing issues and discussions
          required: true
