# GoReleaser configuration for tagged releases (see .github/workflows/release.yml).
# Release notes come from the matching CHANGELOG.md section via --release-notes.
version: 2

project_name: xy2api

builds:
  - id: xy2api
    dir: backend
    main: ./cmd/server
    binary: xy2api
    flags:
      - -tags=embed
      - -trimpath
    env:
      - CGO_ENABLED=0
    # Official targets: Linux x86-64, Windows x86-64, macOS Apple silicon.
    goos: [linux, windows, darwin]
    goarch: [amd64, arm64]
    ignore:
      - goos: linux
        goarch: arm64
      - goos: windows
        goarch: arm64
      - goos: darwin
        goarch: amd64
    ldflags:
      - -s -w
      - -X main.Commit={{ .Commit }}
      - -X main.Date={{ .Date }}
      - -X main.BuildType=release

archives:
  - id: default
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README*.md
      - CHANGELOG.md
      # Deployment files (scripts, Compose files, configuration examples).
      - deploy/README.md
      - deploy/Caddyfile
      - deploy/.env.example
      - deploy/*.example
      - deploy/*.yaml
      - deploy/*.yml
      - deploy/*.sh
      - deploy/*.sql
      - deploy/*.service
      - deploy/*.tmpl
      # Fallback model pricing, loaded from ./resources/model-pricing at runtime.
      - src: backend/resources/model-pricing/*
        dst: resources/model-pricing
        strip_parent: true

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  disable: true

dockers_v2:
  - id: ghcr
    ids: [xy2api]
    dockerfile: Dockerfile.goreleaser
    platforms: [linux/amd64]
    images:
      - "ghcr.io/{{ .Env.GITHUB_REPO_OWNER_LOWER }}/xy2api"
    # Moving tags are only published for final releases.
    tags:
      - "{{ .Version }}"
      - "{{ if not .Prerelease }}{{ .Major }}.{{ .Minor }}{{ end }}"
      - "{{ if not .Prerelease }}{{ .Major }}{{ end }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    extra_files:
      - deploy/docker-entrypoint.sh
      - backend/resources
    labels:
      org.opencontainers.image.title: XY2API
      org.opencontainers.image.description: AI API gateway for subscription and API-key accounts
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.source: "https://github.com/{{ .Env.GITHUB_REPOSITORY }}"
      org.opencontainers.image.licenses: LGPL-3.0-or-later

release:
  draft: false
  prerelease: auto
  name_template: "XY2API {{ .Version }}"
  footer: |

    ---

    **Install** · [Docker](https://github.com/{{ .Env.GITHUB_REPOSITORY }}/blob/main/docs/deployment/docker.md) `docker pull ghcr.io/{{ .Env.GITHUB_REPO_OWNER_LOWER }}/xy2api:{{ .Version }}` · [Linux script](https://github.com/{{ .Env.GITHUB_REPOSITORY }}/blob/main/docs/deployment/binary.md) · binaries for linux/amd64, windows/amd64 and darwin/arm64 below.

    **Full changelog**: [{{ .PreviousTag }}...{{ .Tag }}](https://github.com/{{ .Env.GITHUB_REPOSITORY }}/compare/{{ .PreviousTag }}...{{ .Tag }})
